name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Pages and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify generated people map is up to date
        run: |
          npm run sync:people-map
          git diff --exit-code -- cloudflare/lib/people-map.js

      - name: Build static Pages fallback
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "${FOOTBALL_DATA_API_KEY:-}" ]; then
            echo "Missing repository secret FOOTBALL_DATA_API_KEY." >&2
            exit 1
          fi
          npm run build:strict

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name worldcup-sweepstake
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync football-data.org API key to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "${FOOTBALL_DATA_API_KEY:-}" ]; then
            echo "Missing repository secret FOOTBALL_DATA_API_KEY." >&2
            exit 1
          fi
          printf '%s' "${FOOTBALL_DATA_API_KEY}" | npx wrangler secret put FOOTBALL_DATA_API_KEY --config cloudflare/worker/wrangler.toml

      - name: Deploy scheduled Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/worker/wrangler.toml

      - name: Trigger deployed Worker refresh
        env:
          WORKER_REFRESH_URL: ${{ vars.WORKER_REFRESH_URL }}
          WORKER_REFRESH_TOKEN: ${{ secrets.WORKER_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_REFRESH_URL:-}" ]]; then
            echo "Missing repository variable WORKER_REFRESH_URL (for example: https://worldcup-sweepstake-updater.<your-workers-subdomain>.workers.dev)." >&2
            exit 1
          fi
          if [[ -z "${WORKER_REFRESH_TOKEN:-}" ]]; then
            echo "Missing repository secret WORKER_REFRESH_TOKEN. It must match the Worker's UPDATE_TOKEN secret." >&2
            exit 1
          fi
          curl --fail --show-error --silent --request POST \
            --header "Authorization: Bearer ${WORKER_REFRESH_TOKEN}" \
            --header "Accept: application/json" \
            "${WORKER_REFRESH_URL%/}/refresh"
