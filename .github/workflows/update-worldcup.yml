name: Update World Cup site

on:
  workflow_dispatch:
  schedule:
    # Check every 5 minutes, but only build/deploy during match windows.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.match-window.outputs.should_update }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check match window
        id: match-window
        run: echo "should_update=$(python -m src.worldcup_site.generate --should-update-now)" >> "$GITHUB_OUTPUT"

      - name: Build static site
        if: github.event_name == 'workflow_dispatch' || steps.match-window.outputs.should_update == 'true'
        run: python -m src.worldcup_site.generate

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.match-window.outputs.should_update == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' || steps.match-window.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.should_update == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
