name = "worldcup-sweepstake-updater"
main = "scheduled.js"
compatibility_date = "2026-06-12"
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[triggers]
# Lightweight safety bootstrap only. The heavy updater runs inside the Durable Object alarm.
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "UPDATER_COORDINATOR"
class_name = "UpdaterCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UpdaterCoordinator"]

# Set this secret to enable manual POST /refresh with Authorization: Bearer <token>.
# Run: npx wrangler secret put UPDATE_TOKEN --config cloudflare/worker/wrangler.toml
