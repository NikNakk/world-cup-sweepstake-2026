name = "worldcup-sweepstake-updater"
main = "scheduled.js"
compatibility_date = "2026-06-12"
workers_dev = true

[triggers]
crons = ["3-59/5 * * * *"]

[[kv_namespaces]]
binding = "WORLDCUP_SITE"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Optional: set this secret to require Authorization: Bearer <token> for POST /refresh.
# Run: npx wrangler secret put UPDATE_TOKEN --config cloudflare/worker/wrangler.toml
